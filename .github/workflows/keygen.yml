name: Keygen certificate

# Builds the `ZcashKeygen` lake target: the verifying-key derivation family
# (`Zcash/Snark/Keygen/`), including `Certificate.lean`'s bundled `native_decide`
# certifying `vk = orchardActionTopLevelCircuit.toVerifierKey actionProofParams
# capturedURS` field by field against the capture. The target is excluded from
# `defaultTargets` because the certificate evaluates a group FFT and 44 commitment
# MSMs; after the proven fast paths (round-parallel projective FFT, scatter-bucket
# Pippenger, dictionary-free point adds) the whole lane runs in minutes, so this
# workflow keeps it continuously certified instead of relying on manual runs.
#
# Triggers: pushes touching the keygen family or its inputs (the pinned Clean rev in
# the lakefile, the captured fixture), plus manual dispatch. Not a required check —
# the default `lake build` (Lean CI) stays the gate; this lane reports separately.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Zcash/Snark/Keygen/**'
      - 'Zcash/Snark/Soundness/Deployed/ActionVk.lean'
      - 'Zcash/Snark/Fixtures/SingleAction/Fixture.lean'
      - 'Zcash/Common/ParMap.lean'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - '.github/workflows/keygen.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  certificate:
    name: Build the ZcashKeygen lane
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Installs the toolchain from lean-toolchain and fetches the Mathlib olean
      # cache, then builds only the keygen lane target.
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build-args: "--wfail ZcashKeygen"
