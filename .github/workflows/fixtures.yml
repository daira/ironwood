name: Fixtures

# Enforces that every checked-in verifier-fingerprint fixture family -- the honest
# `Zcash/Snark/Fixtures/{SingleAction,MultiAction}/Fixture.lean` captures and the random
# match-only `{SingleActionRandom,MultiActionRandom,TripleActionRandom}` families with
# their `proof-bytes.hex` siblings -- is byte-for-byte what the pinned public sources
# regenerate, by running `scripts/regenerate-fingerprint-fixtures.sh`. The fixtures stay
# checked in -- they are the formal artifact the Lean development proves about, imported
# by the `FixtureCheck` target and required for a self-contained `lake build` -- and this
# workflow closes the "trust that a human ran the capture correctly" gap by regenerating
# them in CI and diffing. See zcash/ironwood#54.
#
# Determinism: the captures use fixed ChaCha20 seeds and the exporter orders points by
# a coordinate-key `BTreeSet` (not HashMap iteration order), and field/curve arithmetic
# is platform-independent, so regeneration is bit-reproducible -- a diff means the
# fixtures genuinely drifted from the pinned upstream, not run-to-run noise.
#
# Pins: single-sourced in `scripts/regenerate-fingerprint-fixtures.sh`. The Halo2 pin is
# the public zcash/halo2#924 head (the match-only exporter mode and the
# `numInstanceColumns` shape emission), asserted by the script to descend from the
# `release/halo2_proofs-0.3.4` pin; the Orchard pin is asserted to be exactly one commit
# atop the 0.15.3 release. The honest pair was previously regenerated here from the
# released crates.io `halo2_proofs` 0.3.4 alone; the checked-in honest bytes now carry
# the branch exporter's shape emission, so that release-pin-only regeneration resumes
# once a released halo2_proofs ships it.

# Always triggers, so the `Fixtures CI` gate always reports (a workflow skipped by
# `on.paths` would leave a required check pending). The heavy regeneration is instead
# gated on a path filter computed inside the run, so it only builds Rust when the
# fixtures or the pins (the regeneration script, or this workflow) actually change.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect fixture-relevant changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fixtures: ${{ steps.filter.outputs.fixtures }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # Regeneration is expensive (real k=11 Orchard proofs + verifier runs), so only run
      # it when a committed capture artifact or the pins change.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            fixtures:
              - 'Zcash/Snark/Fixtures/SingleAction/Fixture.lean'
              - 'Zcash/Snark/Fixtures/MultiAction/Fixture.lean'
              - 'Zcash/Snark/Fixtures/SingleActionRandom/Fixture.lean'
              - 'Zcash/Snark/Fixtures/SingleActionRandom/proof-bytes.hex'
              - 'Zcash/Snark/Fixtures/MultiActionRandom/Fixture.lean'
              - 'Zcash/Snark/Fixtures/MultiActionRandom/proof-bytes.hex'
              - 'Zcash/Snark/Fixtures/TripleActionRandom/Fixture.lean'
              - 'Zcash/Snark/Fixtures/TripleActionRandom/proof-bytes.hex'
              - 'scripts/regenerate-fingerprint-fixtures.sh'
              - '.github/workflows/fixtures.yml'

  verify:
    name: Regenerate and diff the captured fixtures
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Ironwood (the fixtures under test)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # The script clones the pinned public capture branches, asserts their release
      # lineage and the exact one-package lockfile delta of the halo2_proofs path
      # override, installs Orchard's pinned toolchain (`rustup show` against its
      # `rust-toolchain.toml`), regenerates all five families plus the proof-byte
      # siblings, and diffs every committed artifact byte-for-byte, exiting non-zero on
      # any mismatch. Uncached: the job only runs when the path filter above fires, and a
      # cache keyed on lockfiles the script itself patches mid-run would be unstable.
      - name: Regenerate every fixture family from the pinned capture branches
        run: ./scripts/regenerate-fingerprint-fixtures.sh

  fixtures-ci:
    # The single stable check to mark as a required status check. It always runs, so it
    # always reports; it fails only if regeneration actually diverged.
    name: Fixtures CI
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the verification result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "The changes-detection job did not succeed."
            exit 1
          fi
          case "$VERIFY_RESULT" in
            success|skipped)
              echo "Fixtures matched the pinned capture, or regeneration was not required for this change." ;;
            *)
              echo "Fixture verification result: $VERIFY_RESULT."
              exit 1 ;;
          esac
