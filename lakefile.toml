name = "Zcash"
version = "0.1.0"
keywords = ["cryptography", "math", "protocols"]
defaultTargets = ["Zcash", "FixtureCheck", "Arithmetic"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "fca63dc777ca9de7f533a50196cdd1357d569f4f"

[[require]]
name = "CompElliptic"
git = "https://github.com/daira/CompElliptic"
rev = "a549e4555b17bbbe3c8d48aa7d5b493912ccfbe9"

# mathlib last, so that its pinned versions of the common transitive dependencies
# (batteries, aesop, Qq, proofwidgets, ...) take precedence over CompPoly's.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "Zcash"

# Everything under `Zcash/Snark/Fixtures/` is instance-level: the generated Rust<->Lean captures
# (per-capture subdirectories like `SingleAction`/`MultiAction`, holding the fixture data plus its
# Fiat-Shamir schedule, faithfulness, and negative checks) and the hand-written consensus-max shape
# instantiation (`MaxShape`). The `Zcash` library deliberately does not import them (the captures are
# large, generated, and slow); `Zcash/Snark/Fingerprint/` keeps the reusable match/soundness theory.
# This dedicated target keeps the fixtures out of `lake build Zcash` for local dev, while plain
# `lake build` (the default targets -- what CI runs) compiles them, so the empirical checks are
# exercised alongside the parametric verifier obligations in `Zcash`. New modules under `Fixtures/`
# are picked up by the glob automatically.
[[lean_lib]]
name = "FixtureCheck"
globs = ["Zcash.Snark.Fixtures.+"]

# The fast Pasta arithmetic: `Zcash/Arithmetic/` (ironwood-permanent, mathlib-side) and the two
# temporary vendorings `Zcash/Vendor/CompPoly/` and `Zcash/Vendor/CompElliptic/`, whose READMEs
# state their deletion criteria. Only part of these trees is reachable from the `Zcash` library
# (`Zcash.Arithmetic.FastFftPar` has no importer at all), so without a target of their own the
# unreached modules would silently stop being compiled and warning-checked. In `defaultTargets`
# so plain `lake build` -- what CI runs -- keeps every module honest.
[[lean_lib]]
name = "Arithmetic"
globs = ["Zcash.Arithmetic.+", "Zcash.Vendor.CompPoly.+", "Zcash.Vendor.CompElliptic.+"]

# The ONLY library in this repo with `precompileModules`. It is a core-only leaf: its modules
# import nothing beyond Lean core, so native compilation covers ~4 files rather than a mathlib
# import closure -- the latter is what OOM-crashed a 16 GB box on 2026-07-24. Everything
# mathlib-side about these definitions lives in `Zcash.Vendor.CompPoly.Montgomery.Native64x8*`
# and `Zcash/Arithmetic/`, which are NOT in this lane.
#
# `FastFieldNative` must keep a root module of the same name (`FastFieldNative.lean`): Lean
# derives the dynlib's expected `initialize_…` symbol from the shared object's file name, and
# without a matching module every importer fails with `error loading plugin, initializer not
# found`.
[[lean_lib]]
name = "FastFieldNative"
precompileModules = true
globs = [
  "FastFieldNative",
  "Zcash.Vendor.CompPoly.Montgomery.Native64x8Defs",
  "Zcash.Vendor.CompElliptic.ProjectiveMontDefs",
  "Zcash.Vendor.CompPoly.ScalarFftDefs",
]
