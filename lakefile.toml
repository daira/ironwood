name = "Zcash"
version = "0.1.0"
keywords = ["cryptography", "math", "protocols"]
defaultTargets = ["Zcash", "FixtureCheck", "CircuitCheck", "ZcashKeygen", "Arithmetic"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "Clean"
git = "https://github.com/Verified-zkEVM/clean"
rev = "18c8a6b9"

[[require]]
name = "CompElliptic"
git = "https://github.com/mitschabaude-bot/CompElliptic.git"
rev = "53b35333cb00b664e3cccabd0bc7f50700ff7929"

# mathlib last, so that its pinned versions of the common transitive dependencies
# (batteries, aesop, Qq, proofwidgets, ...) take precedence over CompPoly's.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "Zcash"

# Everything under `Zcash/Snark/Fixtures/` is instance-level: the generated Rust<->Lean captures
# (per-capture subdirectories like `SingleAction`/`MultiAction`, holding the fixture data plus its
# Fiat-Shamir schedule, faithfulness, and negative checks) and the hand-written consensus-max shape
# instantiation (`MaxShape`). The `Zcash` library deliberately does not import them (the captures are
# large, generated, and slow); `Zcash/Snark/Fingerprint/` keeps the reusable match/soundness theory.
# This dedicated target keeps the fixtures out of `lake build Zcash` for local dev, while plain
# `lake build` (the default targets -- what CI runs) compiles them, so the empirical checks are
# exercised alongside the parametric verifier obligations in `Zcash`. New modules under `Fixtures/`
# are picked up by the glob automatically.
[[lean_lib]]
name = "FixtureCheck"
globs = ["Zcash.Snark.Fixtures.+"]

# The circuit-side VK-match and layout tests: fixture comparisons (`#guard`/`#eval`) of the
# projected constraint system and reconstructed keygen layout against the in-repo Rust dumps.
# Instance-level like `FixtureCheck`, so not imported by the `Zcash` library; this target
# keeps them exercised by plain `lake build` (they were previously in no target at all).
[[lean_lib]]
name = "CircuitCheck"
globs = ["Zcash.Circuits.Tests.+"]

# The Action verifying-key COMMITMENT derivation (`Zcash/Snark/Keygen/`): derives
# `fixedCommitment`/`permutationCommonCommitment` from the circuit + captured URS
# (scalar inverse-DFT commitments over the proven Montgomery lane, dense fixed columns,
# keygen permutation polynomials) and assembles the fully-derived `derivedActionVk`.
# `Derivation` contains the reusable data and key; `Certificate` contains the native
# commitment equality. The deployed Action/Vesta corollary also lives in this
# fixture-backed lane; the generic, circuit-derived-key capstone is in `Zcash`.
# In `defaultTargets` since the certificate dropped to ~45 s
# (it once took hours, which is why this lane used to be quarantined behind a
# separate CI workflow).
#
# The fast arithmetic this lane runs on lives in the `Arithmetic` library below.
[[lean_lib]]
name = "ZcashKeygen"
globs = [
  "Zcash.Snark.Keygen.+",
  "Zcash.Snark.Soundness.Deployed.ActionVk",
  "Zcash.Snark.Soundness.Deployed.ActionVesta",
]

# The fast Pasta arithmetic: the umbrella root `Zcash/Arithmetic.lean` (which re-exports `Fp`
# and `URS` at the `Zcash` root), the tree below it (ironwood-permanent, mathlib-side), and the
# remaining temporary vendoring `Zcash/Vendor/CompPoly/` (the scalar FFT definitions), whose
# README states its deletion criteria. These trees are not reachable from the `Zcash` library;
# only the keygen certificate lane pulls them in. Giving them a target of their own means they
# stay compiled and warning-checked on their own terms rather than incidentally, and it keeps
# `lake build Arithmetic` a cheap check of the kernels alone. In `defaultTargets`
# so plain `lake build` -- what CI runs -- keeps every module honest.
[[lean_lib]]
name = "Arithmetic"
globs = ["Zcash.Arithmetic", "Zcash.Arithmetic.+", "Zcash.Vendor.CompPoly.+"]

# The ONLY library in this repo with `precompileModules`. It is a core-only leaf: its modules
# import nothing beyond Lean core, so native compilation covers a couple of files rather than a
# mathlib import closure -- the latter is what OOM-crashed a 16 GB box on 2026-07-24. The field
# and Vesta-point definitions now come from the CompElliptic pin's own precompiled
# `FastFieldNative` lane; only the scalar FFT is still local. Everything mathlib-side about
# these definitions lives in `Zcash/Arithmetic/`, which is NOT in this lane.
#
# `Zcash.FastFieldNative` must keep a root module of the same name
# (`Zcash/FastFieldNative.lean`): Lean derives the dynlib's expected `initialize_…` symbol from
# the shared object's file name, and without a matching module every importer fails with
# `error loading plugin, initializer not found`.
#
# The name may NOT be a bare `FastFieldNative`, which is what the CompElliptic pin calls its own
# precompiled lane. Lean module names are global across the build, so two `FastFieldNative.lean`
# roots collide -- and they collide *silently*: `lake build` stays green, but Lake never emits
# ironwood's shared object and `Zcash.Arithmetic.ScalarFftEquiv` is handed only the pin's
# plugin, so `ScalarFftDefs` runs interpreted. A dotted `lean_lib` name is enough to keep them
# apart; it yields `libZcash_Zcash_FastFieldNative.so`. Note this module is NOT in the `Zcash`
# library: that lib's default glob is its root module alone, so the native lane stays a leaf.
[[lean_lib]]
name = "Zcash.FastFieldNative"
precompileModules = true
globs = [
  "Zcash.FastFieldNative",
  "Zcash.Vendor.CompPoly.ScalarFftDefs",
]
